# Genera el libro con Quarto y lo publica en GitHub Pages en cada push a main.
# Requisito (una sola vez): Settings → Pages → Build and deployment → Source: «GitHub Actions».
name: Publicar el libro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19
      - name: Generar el libro
        run: quarto render          # el post-render usa python3, ya instalado en ubuntu-latest
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
