<title id="t1">Dos búsquedas que pasan siempre al mejor vecino, en un paisaje con dos cimas</title>
<desc id="d1">Valor de la función objetivo, que se quiere maximizar, para 21 soluciones, de x = 0 a x = 20. Cada solución es vecina de las que tiene al lado. Hay dos cimas: un óptimo local en x = 5, con f = 7,0, y el óptimo global en x = 15, con f = 10,0. Una búsqueda que empieza en x = 1 sube hasta x = 5 y se para, porque ningún vecino es mejor. Otra que empieza en x = 11 sube hasta x = 15, el óptimo global.</desc>
