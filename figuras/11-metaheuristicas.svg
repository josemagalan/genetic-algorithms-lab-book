<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t1 d1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title id="t1">Un mapa de metaheurísticas, entre explorar y explotar</title><desc id="d1">Una flecha horizontal va de explorar, o diversificar, a la izquierda, a explotar, o intensificar, a la derecha. En el extremo izquierdo está la búsqueda al azar y en el derecho, la búsqueda local que pasa al mejor vecino. Entre ellas, dos cajas. La de la izquierda, metaheurísticas de población, tiende a explorar: evolutivas (algoritmos genéticos, destacados, estrategias evolutivas, programación genética, evolución diferencial y estimación de distribuciones) y de enjambre (colonias de hormigas y enjambres de partículas). La de la derecha, metaheurísticas de trayectoria, tiende a explotar: recocido simulado, búsqueda tabú, búsqueda local iterada, búsqueda de vecindario variable y GRASP. Una llave bajo las dos cajas indica que los métodos híbridos, como los algoritmos meméticos, combinan unas y otras.</desc><defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><rect width="720" height="400" fill="#ffffff"/><rect x="120" y="14" width="250" height="253" rx="10" fill="#dbe8f9" stroke="#2a78d6" stroke-width="1.5"/><text x="245.0" y="38" text-anchor="middle" font-size="15" font-weight="600" font-style="normal" fill="#0b0b0b">De población</text><text x="245.0" y="56" text-anchor="middle" font-size="12" font-weight="normal" font-style="italic" fill="#52514e">tienden a explorar</text><text x="136" y="80" text-anchor="start" font-size="12" font-weight="600" font-style="normal" fill="#52514e">Evolutivas</text><rect x="142" y="87" width="206" height="20" rx="4" fill="#2a78d6"/><text x="150" y="102" text-anchor="start" font-size="13" font-weight="600" font-style="normal" fill="#ffffff">Algoritmos genéticos</text><text x="150" y="122" text-anchor="start" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b">Estrategias evolutivas</text><text x="150" y="143" text-anchor="start" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b">Programación genética</text><text x="150" y="164" text-anchor="start" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b">Evolución diferencial</text><text x="150" y="185" text-anchor="start" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b">Estimación de distribuciones</text><text x="136" y="206" text-anchor="start" font-size="12" font-weight="600" font-style="normal" fill="#52514e">De enjambre</text><text x="150" y="227" text-anchor="start" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b">Colonias de hormigas</text><text x="150" y="248" text-anchor="start" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b">Enjambres de partículas</text><rect x="386" y="14" width="214" height="169" rx="10" fill="#f1f0ec" stroke="#52514e" stroke-width="1.5"/><text x="493.0" y="38" text-anchor="middle" font-size="15" font-weight="600" font-style="normal" fill="#0b0b0b">De trayectoria</text><text x="493.0" y="56" text-anchor="middle" font-size="12" font-weight="normal" font-style="italic" fill="#52514e">tienden a explotar</text><text x="416" y="80" text-anchor="start" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b">Recocido simulado</text><text x="416" y="101" text-anchor="start" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b">Búsqueda tabú</text><text x="416" y="122" text-anchor="start" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b">Búsqueda local iterada</text><text x="416" y="143" text-anchor="start" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b">Vecindario variable (VNS)</text><text x="416" y="164" text-anchor="start" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b">GRASP</text><rect x="10" y="84" width="100" height="60" rx="10" fill="#ffffff" stroke="#7a7974" stroke-width="1.3" stroke-dasharray="4 3"/><text x="60" y="110" text-anchor="middle" font-size="12.5" font-weight="600" font-style="normal" fill="#0b0b0b">Búsqueda</text><text x="60" y="128" text-anchor="middle" font-size="12" font-weight="normal" font-style="normal" fill="#52514e">al azar</text><rect x="610" y="84" width="100" height="60" rx="10" fill="#ffffff" stroke="#7a7974" stroke-width="1.3" stroke-dasharray="4 3"/><text x="660" y="110" text-anchor="middle" font-size="12.5" font-weight="600" font-style="normal" fill="#0b0b0b">Búsqueda local</text><text x="660" y="128" text-anchor="middle" font-size="12" font-weight="normal" font-style="normal" fill="#52514e">al mejor vecino</text><path d="M122,279 q0,12 12,12 L348,291 q12,0 12,12 q0,-12 12,-12 L586,291 q12,0 12,-12" fill="none" stroke="#eb6834" stroke-width="1.6"/><text x="360" y="323" text-anchor="middle" font-size="13" font-weight="normal" font-style="normal" fill="#0b0b0b">Híbridos: combinan las dos, como los algoritmos meméticos</text><line x1="22" y1="355" x2="698" y2="355" stroke="#52514e" stroke-width="1.8" marker-start="url(#punta)" marker-end="url(#punta)"/><text x="22" y="377" text-anchor="start" font-size="13" font-weight="600" font-style="normal" fill="#0b0b0b">Explorar (diversificar)</text><text x="698" y="377" text-anchor="end" font-size="13" font-weight="600" font-style="normal" fill="#0b0b0b">Explotar (intensificar)</text></svg>
