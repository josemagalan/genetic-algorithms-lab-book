<title id="t">Mejor aptitud de la población en cada generación, con y sin elitismo</title>
<desc id="d">OneMax de 40 bits, población de 20. Con un individuo de élite, la mejor aptitud nunca baja y llega al óptimo, 40, en la generación 42. Sin élite, sube y baja y no llega al óptimo en 100 generaciones. Se marcan las generaciones 38 y 62, en las que pararían los criterios de 10 y de 20 generaciones sin mejora en la ejecución con élite.</desc>
