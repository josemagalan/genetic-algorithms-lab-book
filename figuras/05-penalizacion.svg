<title id="t51">Aptitud de cada individuo según el peso de la penalización</title>
<desc id="d51">Rectas de aptitud F = valor − λ · e de los 8 individuos para λ entre 0 y 5. Los cuatro que caben son horizontales; los cuatro que no caben bajan con pendiente igual a su exceso de peso. Por debajo de λ* = 4, el mejor es I1, que no cabe; por encima, I5, que cabe y vale 20.</desc>
