<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 590" role="img" aria-labelledby="t1 d1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title id="t1">¿Qué método uso? Una orientación en cuatro preguntas</title><desc id="d1">Cuatro preguntas en cascada. Primera: ¿el espacio es pequeño? Si es así, se revisan todas las soluciones. Si no, segunda: ¿es suave y con una sola cima? Si es así, un método que sube por la pendiente. Si no, tercera: ¿hay heurísticas específicas, como en el viajante? Si es así, se usan, solas o dentro de una metaheurística. Si no, hace falta una metaheurística, y la cuarta pregunta elige cuál: ¿conviene combinar partes de buenas soluciones o buscar con muchas a la vez, por ejemplo con varias cimas o varios objetivos? Si es así, una de población, como el algoritmo genético; si no, una de trayectoria, como la búsqueda local, el recocido simulado o la búsqueda tabú. Las dos se pueden combinar en un algoritmo memético. Al final, en todos los casos, hay que fijar el presupuesto de evaluaciones según el horizonte de la decisión, estratégico, táctico u operativo, y ajustar con casos parecidos al real.</desc><defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><rect width="720" height="590" fill="#ffffff"/><rect x="20" y="16" width="380" height="62" rx="9" fill="#ffffff" stroke="#eb6834" stroke-width="1.8"/><text x="210.0" y="43.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0b0b0b">¿El espacio es pequeño?</text><text x="210.0" y="62.0" text-anchor="middle" font-size="12.5" fill="#52514e">se pueden revisar todas las soluciones</text><line x1="400" y1="47.0" x2="448" y2="47.0" stroke="#52514e" stroke-width="1.6" marker-end="url(#punta)"/><text x="425.0" y="40.0" text-anchor="middle" font-size="12.5" font-style="normal" font-weight="normal" fill="#52514e">sí</text><rect x="450" y="16" width="250" height="62" rx="9" fill="#f1f0ec" stroke="#52514e" stroke-width="1.5"/><text x="575.0" y="43.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0b0b0b">Revisarlas todas</text><text x="575.0" y="62.0" text-anchor="middle" font-size="12.5" fill="#52514e">y quedarse con la mejor</text><line x1="210.0" y1="78" x2="210.0" y2="106" stroke="#52514e" stroke-width="1.6" marker-end="url(#punta)"/><text x="220.0" y="97" text-anchor="start" font-size="12.5" font-style="normal" font-weight="normal" fill="#52514e">no</text><rect x="20" y="108" width="380" height="62" rx="9" fill="#ffffff" stroke="#eb6834" stroke-width="1.8"/><text x="210.0" y="135.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0b0b0b">¿Es suave y con una sola cima?</text><text x="210.0" y="154.0" text-anchor="middle" font-size="12.5" fill="#52514e">el paisaje no tiene óptimos locales</text><line x1="400" y1="139.0" x2="448" y2="139.0" stroke="#52514e" stroke-width="1.6" marker-end="url(#punta)"/><text x="425.0" y="132.0" text-anchor="middle" font-size="12.5" font-style="normal" font-weight="normal" fill="#52514e">sí</text><rect x="450" y="108" width="250" height="62" rx="9" fill="#f1f0ec" stroke="#52514e" stroke-width="1.5"/><text x="575.0" y="135.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0b0b0b">Subir por la pendiente</text><text x="575.0" y="154.0" text-anchor="middle" font-size="12.5" fill="#52514e">es mucho más eficiente</text><line x1="210.0" y1="170" x2="210.0" y2="198" stroke="#52514e" stroke-width="1.6" marker-end="url(#punta)"/><text x="220.0" y="189" text-anchor="start" font-size="12.5" font-style="normal" font-weight="normal" fill="#52514e">no</text><rect x="20" y="200" width="380" height="62" rx="9" fill="#ffffff" stroke="#eb6834" stroke-width="1.8"/><text x="210.0" y="227.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0b0b0b">¿Hay heurísticas específicas?</text><text x="210.0" y="246.0" text-anchor="middle" font-size="12.5" fill="#52514e">un problema muy estudiado, como el viajante</text><line x1="400" y1="231.0" x2="448" y2="231.0" stroke="#52514e" stroke-width="1.6" marker-end="url(#punta)"/><text x="425.0" y="224.0" text-anchor="middle" font-size="12.5" font-style="normal" font-weight="normal" fill="#52514e">sí</text><rect x="450" y="200" width="250" height="62" rx="9" fill="#f1f0ec" stroke="#52514e" stroke-width="1.5"/><text x="575.0" y="227.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0b0b0b">Usarlas</text><text x="575.0" y="246.0" text-anchor="middle" font-size="12.5" fill="#52514e">solas o dentro de una metaheurística</text><line x1="210.0" y1="262" x2="210.0" y2="290" stroke="#52514e" stroke-width="1.6" marker-end="url(#punta)"/><text x="220.0" y="281" text-anchor="start" font-size="12.5" font-style="normal" font-weight="normal" fill="#52514e">no</text><rect x="10" y="286" width="700" height="232" rx="12" fill="none" stroke="#7a7974" stroke-width="1.2" stroke-dasharray="6 5"/><text x="698" y="306" text-anchor="end" font-size="13" font-style="normal" font-weight="600" fill="#52514e">Hace falta una metaheurística. ¿Cuál?</text><rect x="20" y="316" width="380" height="66" rx="9" fill="#ffffff" stroke="#eb6834" stroke-width="1.8"/><text x="210.0" y="345.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0b0b0b">¿Conviene combinar buenas soluciones?</text><text x="210.0" y="364.0" text-anchor="middle" font-size="12.5" fill="#52514e">o buscar con muchas a la vez: varias cimas u objetivos</text><line x1="130" y1="382" x2="120" y2="436" stroke="#52514e" stroke-width="1.6" marker-end="url(#punta)"/><text x="112" y="408" text-anchor="end" font-size="12.5" font-style="normal" font-weight="normal" fill="#52514e">no</text><line x1="340" y1="382" x2="520" y2="436" stroke="#52514e" stroke-width="1.6" marker-end="url(#punta)"/><text x="382" y="408" text-anchor="start" font-size="12.5" font-style="normal" font-weight="normal" fill="#52514e">sí</text><rect x="20" y="438" width="250" height="62" rx="9" fill="#f1f0ec" stroke="#52514e" stroke-width="1.5"/><text x="145.0" y="465.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0b0b0b">De trayectoria</text><text x="145.0" y="484.0" text-anchor="middle" font-size="12.5" fill="#52514e">búsqueda local, recocido, tabú</text><rect x="390" y="438" width="300" height="62" rx="9" fill="#dbe8f9" stroke="#2a78d6" stroke-width="1.5"/><text x="540.0" y="465.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0b0b0b">De población</text><text x="540.0" y="484.0" text-anchor="middle" font-size="12.5" fill="#52514e">el algoritmo genético y otras</text><line x1="272" y1="469.0" x2="388" y2="469.0" stroke="#52514e" stroke-width="1.4" stroke-dasharray="5 4" marker-start="url(#punta)" marker-end="url(#punta)"/><text x="330" y="461.0" text-anchor="middle" font-size="12" font-style="italic" font-weight="normal" fill="#7a7974">combinarlas:</text><text x="330" y="487.0" text-anchor="middle" font-size="12" font-style="italic" font-weight="normal" fill="#7a7974">memético</text><rect x="10" y="530" width="700" height="52" rx="9" fill="#f1f0ec" stroke="none"/><text x="360.0" y="551" text-anchor="middle" font-size="13" font-style="normal" font-weight="normal" fill="#0b0b0b">En todos los casos: fija el presupuesto de evaluaciones según el horizonte</text><text x="360.0" y="570" text-anchor="middle" font-size="13" font-style="normal" font-weight="normal" fill="#0b0b0b">(estratégico, táctico u operativo) y ajusta con casos parecidos al real</text></svg>
