<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-labelledby="t1 d1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t1">Genotipo, fenotipo y aptitud de un individuo</title>
<desc id="d1">Un cromosoma de 8 bits, 1010 0011, se decodifica en el punto (x₁, x₂) = (1,67; −3,00), y la función de aptitud lo evalúa: f = 139,38. El cruce y la mutación actúan sobre el cromosoma; la función de aptitud actúa sobre el punto decodificado.</desc>
<rect width="760" height="290" fill="#ffffff"/>
<text x="36.0" y="44.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">Genotipo (cromosoma)</text>
<text x="420.0" y="44.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">Fenotipo (solución)</text>
<text x="660.0" y="44.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">Aptitud</text>
<rect x="36" y="74" width="30" height="36" rx="3" fill="#dbe8f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="51.0" y="98.0" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="600">1</text>
<rect x="68" y="74" width="30" height="36" rx="3" fill="#ffffff" stroke="#7a7974" stroke-width="1.5"/>
<text x="83.0" y="98.0" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="600">0</text>
<rect x="100" y="74" width="30" height="36" rx="3" fill="#dbe8f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="115.0" y="98.0" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="600">1</text>
<rect x="132" y="74" width="30" height="36" rx="3" fill="#ffffff" stroke="#7a7974" stroke-width="1.5"/>
<text x="147.0" y="98.0" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="600">0</text>
<rect x="170" y="74" width="30" height="36" rx="3" fill="#ffffff" stroke="#7a7974" stroke-width="1.5"/>
<text x="185.0" y="98.0" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="600">0</text>
<rect x="202" y="74" width="30" height="36" rx="3" fill="#ffffff" stroke="#7a7974" stroke-width="1.5"/>
<text x="217.0" y="98.0" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="600">0</text>
<rect x="234" y="74" width="30" height="36" rx="3" fill="#dbe8f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="249.0" y="98.0" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="600">1</text>
<rect x="266" y="74" width="30" height="36" rx="3" fill="#dbe8f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="281.0" y="98.0" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="600">1</text>
<path d="M36,124 V130 H162 V124" fill="none" stroke="#7a7974" stroke-width="2"/>
<text x="99.0" y="150.0" font-size="13" fill="#52514e" text-anchor="middle">gen x₁: z = 10</text>
<path d="M170,124 V130 H296 V124" fill="none" stroke="#7a7974" stroke-width="2"/>
<text x="233.0" y="150.0" font-size="13" fill="#52514e" text-anchor="middle">gen x₂: z = 3</text>
<line x1="310" y1="92" x2="388" y2="92" stroke="#52514e" stroke-width="2"/><polygon points="396,92 386,86.5 386,97.5" fill="#52514e"/>
<text x="353.0" y="78.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">decodificar</text>
<text x="353.0" y="116.0" font-size="13" fill="#52514e" text-anchor="middle">x = a + z · Δ</text>
<rect x="410" y="62" width="170" height="64" rx="6" fill="#ffffff" stroke="#52514e" stroke-width="1.5"/>
<text x="495.0" y="88.0" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="600">x₁ = 1,67</text>
<text x="495.0" y="112.0" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="600">x₂ = −3,00</text>
<line x1="586" y1="92" x2="646" y2="92" stroke="#52514e" stroke-width="2"/><polygon points="654,92 644,86.5 644,97.5" fill="#52514e"/>
<text x="620.0" y="78.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">evaluar</text>
<rect x="660" y="62" width="90" height="64" rx="6" fill="#ffffff" stroke="#52514e" stroke-width="1.5"/>
<text x="705.0" y="100.0" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">f = 139,38</text>
<path d="M36,220 V226 H296 V220" fill="none" stroke="#eb6834" stroke-width="2"/>
<text x="36.0" y="252.0" font-size="14" fill="#0b0b0b" text-anchor="start">Aquí actúan el cruce y la mutación</text>
<text x="36.0" y="272.0" font-size="13" fill="#52514e" text-anchor="start">Operan sobre los bits, sin saber qué significan.</text>
<path d="M410,220 V226 H750 V220" fill="none" stroke="#2a78d6" stroke-width="2"/>
<text x="410.0" y="252.0" font-size="14" fill="#0b0b0b" text-anchor="start">Aquí actúa la función de aptitud</text>
<text x="410.0" y="272.0" font-size="13" fill="#52514e" text-anchor="start">Evalúa la solución, sin ver los bits.</text>
</svg>
