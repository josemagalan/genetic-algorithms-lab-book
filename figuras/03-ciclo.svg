<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" role="img" aria-labelledby="t1 d1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t1">El ciclo de un algoritmo genético</title><desc id="d1">A la izquierda, lo que se hace una sola vez: representar el problema, crear la población inicial y evaluarla. Una flecha lleva a la pregunta ¿Parar? Si la respuesta es no, empieza una generación: seleccionar los padres, cruzarlos, mutar a los hijos, evaluar a los hijos y reemplazar, que forma la población siguiente y vuelve a la pregunta. Si la respuesta es sí, el algoritmo devuelve la mejor solución encontrada.</desc><defs><marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><rect width="780" height="360" fill="#ffffff"/><text x="110" y="36" text-anchor="middle" font-size="13" font-weight="600" fill="#52514e">Antes del ciclo · una vez</text><rect x="20" y="54" width="180" height="48" rx="8" fill="#f1f0ec" stroke="#52514e" stroke-width="1.5"/><text x="110.0" y="75.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0b0b0b">Representar</text><text x="110.0" y="93.0" text-anchor="middle" font-size="12" fill="#52514e">define los cromosomas</text><line x1="110" y1="102" x2="110" y2="132" stroke="#52514e" stroke-width="1.6" marker-end="url(#punta)"/><rect x="20" y="134" width="180" height="48" rx="8" fill="#f1f0ec" stroke="#52514e" stroke-width="1.5"/><text x="110.0" y="155.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0b0b0b">Crear P(0)</text><text x="110.0" y="173.0" text-anchor="middle" font-size="12" fill="#52514e">la población inicial</text><line x1="110" y1="182" x2="110" y2="212" stroke="#52514e" stroke-width="1.6" marker-end="url(#punta)"/><rect x="20" y="214" width="180" height="48" rx="8" fill="#f1f0ec" stroke="#52514e" stroke-width="1.5"/><text x="110.0" y="235.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0b0b0b">Evaluar P(0)</text><text x="110.0" y="253.0" text-anchor="middle" font-size="12" fill="#52514e">mide su aptitud</text><rect x="250" y="48" width="520" height="236" rx="12" fill="none" stroke="#7a7974" stroke-width="1.2" stroke-dasharray="6 5"/><text x="510" y="36" text-anchor="middle" font-size="13" font-weight="600" fill="#52514e">En cada generación</text><rect x="260" y="70" width="150" height="56" rx="8" fill="#dbe8f9" stroke="#2a78d6" stroke-width="1.5"/><text x="335.0" y="95.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0b0b0b">Seleccionar</text><text x="335.0" y="113.0" text-anchor="middle" font-size="12" fill="#52514e">elige los padres</text><rect x="435" y="70" width="150" height="56" rx="8" fill="#dbe8f9" stroke="#2a78d6" stroke-width="1.5"/><text x="510.0" y="95.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0b0b0b">Cruzar</text><text x="510.0" y="113.0" text-anchor="middle" font-size="12" fill="#52514e">combina los genes</text><rect x="610" y="70" width="150" height="56" rx="8" fill="#dbe8f9" stroke="#2a78d6" stroke-width="1.5"/><text x="685.0" y="95.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0b0b0b">Mutar</text><text x="685.0" y="113.0" text-anchor="middle" font-size="12" fill="#52514e">introduce cambios</text><rect x="610" y="210" width="150" height="56" rx="8" fill="#dbe8f9" stroke="#2a78d6" stroke-width="1.5"/><text x="685.0" y="235.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0b0b0b">Evaluar</text><text x="685.0" y="253.0" text-anchor="middle" font-size="12" fill="#52514e">aptitud de los hijos</text><rect x="435" y="210" width="150" height="56" rx="8" fill="#dbe8f9" stroke="#2a78d6" stroke-width="1.5"/><text x="510.0" y="235.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0b0b0b">Reemplazar</text><text x="510.0" y="253.0" text-anchor="middle" font-size="12" fill="#52514e">forma P(t + 1)</text><line x1="410" y1="98" x2="433" y2="98" stroke="#52514e" stroke-width="1.6" marker-end="url(#punta)"/><text x="422" y="62" text-anchor="middle" font-size="12" font-style="italic" fill="#7a7974">padres</text><line x1="585" y1="98" x2="608" y2="98" stroke="#52514e" stroke-width="1.6" marker-end="url(#punta)"/><text x="597" y="62" text-anchor="middle" font-size="12" font-style="italic" fill="#7a7974">hijos</text><line x1="685" y1="126" x2="685" y2="208" stroke="#52514e" stroke-width="1.6" marker-end="url(#punta)"/><text x="695" y="172" text-anchor="start" font-size="12" font-style="italic" fill="#7a7974">hijos</text><text x="695" y="186" text-anchor="start" font-size="12" font-style="italic" fill="#7a7974">mutados</text><line x1="610" y1="238" x2="587" y2="238" stroke="#52514e" stroke-width="1.6" marker-end="url(#punta)"/><line x1="435" y1="238" x2="397" y2="238" stroke="#52514e" stroke-width="1.6" marker-end="url(#punta)"/><polygon points="335,204 395,238 335,272 275,238" fill="#ffffff" stroke="#eb6834" stroke-width="1.8"/><text x="335" y="243" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">¿Parar?</text><line x1="200" y1="238" x2="273" y2="238" stroke="#52514e" stroke-width="1.6" marker-end="url(#punta)"/><line x1="335" y1="204" x2="335" y2="128" stroke="#52514e" stroke-width="1.6" marker-end="url(#punta)"/><text x="345" y="170" text-anchor="start" font-size="12" font-style="normal" fill="#52514e">no</text><line x1="335" y1="272" x2="335" y2="304" stroke="#52514e" stroke-width="1.6" marker-end="url(#punta)"/><text x="345" y="294" text-anchor="start" font-size="12" font-style="normal" fill="#52514e">sí</text><rect x="235" y="306" width="200" height="46" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/><text x="335.0" y="326.0" text-anchor="middle" font-size="15" font-weight="600" fill="#0b0b0b">Devolver</text><text x="335.0" y="344.0" text-anchor="middle" font-size="12" fill="#52514e">la mejor solución encontrada</text></svg>
