<title id="t3">Bits que cambian al pasar de un entero al siguiente, en binario estándar y en código Gray</title>
<desc id="d3">Gráfica de barras para los números de 0 a 15 con 4 bits. En binario estándar, pasar de un entero al siguiente cambia entre 1 y 4 bits; de 7 a 8 cambian los 4. En código Gray, cambia siempre un solo bit.</desc>
