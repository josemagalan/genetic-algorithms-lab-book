<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="t2 d2" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t2">Las ocho cadenas de 3 bits como vértices de un cubo, con una flecha hacia el mejor vecino</title>
<desc id="d2">Cada vértice es una cadena con su valor de f; las aristas unen las cadenas que se diferencian en un bit. De cada cadena sale una flecha hacia su mejor vecino, si es mejor que ella: 000 va a 100; 001, a 011; 010, a 110; 100, a 110; 101, a 100, y 111, a 110. De 011 y de 110 no sale ninguna flecha: son óptimos locales, y 110, con f = 6, es el global. Siguiendo las flechas, desde 001 se llega a 011; desde las otras cinco cadenas, a 110.</desc>
