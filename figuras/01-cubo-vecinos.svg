<text x="465.0" y="157.0" font-size="13" fill="#52514e" text-anchor="middle">f = 6</text>
<circle cx="585" cy="50" r="31" fill="#dbe8f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="585.0" y="48.0" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="ui-monospace, Menlo, Consolas, monospace">111</text>
<text x="585.0" y="67.0" font-size="13" fill="#52514e" text-anchor="middle">f = 2</text>
<text x="504.0" y="145.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">óptimo global</text>
<text x="256.0" y="28.0" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="600">óptimo local</text>
<circle cx="40" cy="408" r="7" fill="#dbe8f9" stroke="#2a78d6" stroke-width="1.5"/>
<text x="54.0" y="412.0" font-size="13" fill="#0b0b0b" text-anchor="start">Siguiendo las flechas se llega a 110</text>
<circle cx="340" cy="408" r="7" fill="#fbe1d6" stroke="#eb6834" stroke-width="1.5"/>
<text x="354.0" y="412.0" font-size="13" fill="#0b0b0b" text-anchor="start">Se llega a 011</text>
<text x="500.0" y="412.0" font-size="13" fill="#52514e" text-anchor="start">Borde grueso: ningún vecino es mejor</text>
</svg>
