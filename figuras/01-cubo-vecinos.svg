<line x1="465" y1="340" x2="585" y2="250" stroke="#e4e3df" stroke-width="3"/>
<line x1="585" y1="250" x2="585" y2="50" stroke="#e4e3df" stroke-width="3"/>
<line x1="465" y1="140" x2="585" y2="50" stroke="#e4e3df" stroke-width="3"/>
